<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千载犹闻马蹄声</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap');
        :root { --gold:#b8a27e; --brown:#9b7b5b; --dark:#3d2b1f; --bg:#f5efe6; --shadow:rgba(61,43,31,0.25); --font:'Noto Serif SC','Ma Shan Zheng',serif; }
        html,body { width:100%; height:100%; font-family:var(--font); background:#2a1f16; overflow:hidden; }
        #app { position:relative; width:100vw; height:100vh; background:#2a1f16; overflow:hidden; }
        #cover-screen { position:absolute; inset:0; z-index:200; background:url('tp/fengmian.png') center/cover no-repeat; cursor:pointer; transition:opacity 0.8s ease; }
        #cover-screen.hide { opacity:0; pointer-events:none; }
        #cover-screen .cover-hint { position:absolute; bottom:10%; left:50%; transform:translateX(-50%); color:#fff; font-size:1.2rem; letter-spacing:0.3em; text-shadow:0 2px 12px rgba(0,0,0,0.6); animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:0.6;} 50%{opacity:1;} }
        #game-screen { position:absolute; inset:0; display:none; flex-direction:column; background:var(--bg); }
        #game-screen.active { display:flex; }
        #scene-bg { position:absolute; inset:0; background:center/cover no-repeat; transition:background-image 0.6s ease; z-index:0; }
        #dialog-box { position:fixed; bottom:0; left:0; right:0; z-index:100; background:linear-gradient(180deg,rgba(245,239,230,0.2) 0%,rgba(245,239,230,0.96) 25%,#f5efe6 100%); backdrop-filter:blur(6px); padding:0.8rem 2.2rem 1rem 2.2rem; border-top:2px solid var(--gold); box-shadow:0 -8px 40px var(--shadow); min-height:120px; display:flex; flex-direction:column; justify-content:center; margin:0; }
        #char-left { position:absolute; left:-155px; top:-300px; width:600px; height:500px; border:none; background:transparent; box-shadow:none; overflow:visible; z-index:101; display:none; }
        #char-left img { width:100%; height:100%; object-fit:contain; display:block; }
        #char-right.char-person { position:absolute; right:-155px; top:-300px; width:600px; height:500px; border:none; background:transparent; box-shadow:none; overflow:visible; z-index:101; display:none; }
        #char-right.char-person img { width:100%; height:100%; object-fit:contain; display:block; }
        #char-right.char-horse { position:absolute; right:-45px; top:-300px; width:600px; height:500px; border:none; background:transparent; box-shadow:none; overflow:visible; z-index:101; display:none; }
        #char-right.char-horse img { width:100%; height:100%; object-fit:contain; display:block; }
        #char-right.char-horse-special { position:absolute; right:-45px; top:-300px; width:600px; height:500px; border:none; background:transparent; box-shadow:none; overflow:visible; z-index:101; display:none; }
        #char-right.char-horse-special img { width:100%; height:100%; object-fit:contain; display:block; }
        #dialog-character { font-size:1.1rem; font-weight:700; color:var(--brown); letter-spacing:0.1em; margin-bottom:0.2rem; padding-left:180px; padding-right:180px; min-height:1.6em; }
        #dialog-text { font-size:clamp(1rem,1.8vw,1.3rem); line-height:1.8; color:var(--dark); min-height:2.6em; padding-left:180px; padding-right:180px; word-break:break-word; }
        #dialog-continue { position:absolute; right:1.8rem; bottom:0.8rem; padding:0.4rem 1.8rem; font-family:var(--font); font-size:1rem; background:var(--gold); color:#fff; border:none; border-radius:40px; cursor:pointer; box-shadow:0 4px 14px var(--shadow); transition:all 0.25s ease; letter-spacing:0.1em; font-weight:700; z-index:102; }
        #dialog-continue:hover { background:#c4ae88; transform:scale(1.04); }
        #dialog-continue.hidden { display:none; }
        #branch-overlay { position:absolute; inset:0; z-index:200; display:none; align-items:center; justify-content:center; background:rgba(61,43,31,0.5); backdrop-filter:blur(4px); animation:fadeIn 0.3s ease; }
        #branch-overlay.show { display:flex; }
        @keyframes fadeIn { from { opacity:0; transform:scale(0.94); } to { opacity:1; transform:scale(1); } }
        #branch-panel { background:#faf6ef; padding:2rem 2.4rem 2.4rem; border-radius:24px; max-width:500px; width:92%; box-shadow:0 20px 60px rgba(61,43,31,0.5); border:1px solid var(--gold); text-align:center; }
        #branch-panel h3 { font-size:1.2rem; color:var(--dark); margin-bottom:1.6rem; letter-spacing:0.05em; font-weight:400; border-bottom:1px solid #e8ddd0; padding-bottom:0.8rem; }
        .branch-option { display:block; width:100%; padding:0.8rem 1.2rem; margin-bottom:0.8rem; font-family:var(--font); font-size:1.05rem; background:#fff; border:1.5px solid #dccfc0; border-radius:14px; cursor:pointer; transition:all 0.2s ease; color:var(--dark); text-align:center; }
        .branch-option:last-child { margin-bottom:0; }
        .branch-option:hover { background:var(--gold); color:#fff; border-color:var(--gold); transform:translateY(-2px); box-shadow:0 6px 18px var(--shadow); }
        .branch-option.done { opacity:0.6; pointer-events:none; background:#e8ddd0; border-color:#b8a27e; }
        .branch-option.done::after { content:' ✓'; color:#5a7a4a; }
        #puzzle-overlay { position:absolute; inset:0; z-index:180; display:none; align-items:center; justify-content:center; background:rgba(61,43,31,0.6); backdrop-filter:blur(6px); animation:fadeIn 0.3s ease; }
        #puzzle-overlay.show { display:flex; }
        #puzzle-panel { background:#f5efe6; padding:1.8rem 2rem 2.2rem; border-radius:28px; max-width:820px; width:94%; box-shadow:0 24px 64px rgba(61,43,31,0.55); border:2px solid var(--gold); position:relative; }
        #puzzle-close-btn { position:absolute; top:12px; right:16px; font-size:1.8rem; cursor:pointer; color:var(--brown); background:none; border:none; line-height:1; transition:transform 0.2s; z-index:5; }
        #puzzle-close-btn:hover { transform:scale(1.2); }
        #puzzle-panel h3 { text-align:center; font-size:1.2rem; color:var(--dark); letter-spacing:0.1em; margin-bottom:1rem; font-weight:700; }
        #puzzle-container { display:flex; gap:2rem; justify-content:center; align-items:flex-start; flex-wrap:wrap; }
        #puzzle-board { position:relative; width:300px; height:300px; background:#e8ddd0; border:3px solid var(--brown); border-radius:16px; box-shadow:inset 0 0 0 2px #dccfc0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:2px; flex-shrink:0; }
        #puzzle-board .hint-layer { position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:2px; pointer-events:none; opacity:0.25; border-radius:14px; overflow:hidden; }
        #puzzle-board .hint-layer div { background-size:cover; background-position:center; background-repeat:no-repeat; }
        #puzzle-board .slot { background:rgba(255,255,255,0.4); border:1px dashed #b8a27e; border-radius:6px; transition:all 0.15s ease; position:relative; z-index:1; background-size:cover; background-position:center; background-repeat:no-repeat; cursor:pointer; }
        #puzzle-board .slot.filled { border:2px solid var(--brown); background-color:transparent; }
        #puzzle-board .slot.correct { border-color:#5a7a4a; box-shadow:0 0 0 2px #5a7a4a; }
        #puzzle-board .slot.wrong { border-color:#b34a4a; box-shadow:0 0 0 2px #b34a4a; animation:shake 0.3s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
        #puzzle-pieces { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:200px; flex-shrink:0; }
        .piece { width:60px; height:60px; background-size:cover; background-position:center; background-repeat:no-repeat; border:2px solid var(--brown); border-radius:10px; cursor:pointer; transition:all 0.15s ease; box-shadow:0 4px 12px var(--shadow); background-color:#fff; }
        .piece:hover { transform:scale(1.05); border-color:var(--gold); box-shadow:0 6px 20px var(--shadow); }
        .piece.placed { opacity:0.2; pointer-events:none; transform:scale(0.9); }
        .piece.selected { border-color:#c4ae88; box-shadow:0 0 0 3px var(--gold); transform:scale(1.08); }
        #puzzle-status { text-align:center; margin-top:0.8rem; font-size:1rem; color:var(--dark); }
        #puzzle-actions { display:none; justify-content:center; gap:1.2rem; margin-top:1rem; flex-wrap:wrap; }
        #puzzle-actions.show { display:flex; }
        .puzzle-btn { padding:0.5rem 1.8rem; font-family:var(--font); font-size:1rem; border:none; border-radius:40px; cursor:pointer; box-shadow:0 4px 14px var(--shadow); transition:all 0.25s ease; font-weight:700; background:var(--gold); color:#fff; }
        .puzzle-btn:hover { background:#c4ae88; transform:scale(1.04); }
        .puzzle-btn.skip { background:#b8a27e; color:#3d2b1f; }
        .puzzle-btn.skip:hover { background:#c4ae88; }
        .puzzle-btn.continue { background:#5a7a4a; }
        .puzzle-btn.continue:hover { background:#6a8a5a; }
        #end-screen { position:absolute; inset:0; z-index:300; display:none; flex-direction:column; align-items:center; justify-content:center;  animation:fadeIn 0.8s ease; padding:2rem; text-align:center; cursor:pointer; background-size:cover; background-position:center; }
        #end-screen.show { display:flex; }
        #end-screen h2 { font-family:'Ma Shan Zheng',serif; font-size:clamp(2.6rem,6vw,4.2rem); color:var(--dark); margin-bottom:0.4rem; background:linear-gradient(180deg,#5a3f2b,#8a6a4a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        #end-screen p { font-size:clamp(1rem,1.6vw,1.3rem); color:var(--brown); max-width:520px; line-height:2; margin:0.6rem 0 1.8rem; }
        #end-screen .end-emoji { font-size:clamp(4rem,10vw,7rem); margin-bottom:0.6rem; }
        #end-replay { display:none; }
        .hidden { display:none !important; }
        @media (max-width:640px) { /* 略 */ }
        @media (max-width:420px) { /* 略 */ }
    </style>
</head>
<body>
<div id="app">
    <div id="cover-screen"><div class="cover-hint">点击任意处开始</div></div>
    <div id="game-screen">
        <div id="scene-bg"></div>
        <div id="dialog-box">
            <div id="char-left"><img id="left-img" src="tp/xiaojun.png" alt="小俊" /></div>
            <div id="char-right"><img id="right-img" src="" alt="" /></div>
            <div id="dialog-character"></div>
            <div id="dialog-text"></div>
            <button id="dialog-continue">继续</button>
        </div>
        <div id="branch-overlay"><div id="branch-panel"><h3 id="branch-title">请选择</h3><div id="branch-options"></div></div></div>
        <div id="puzzle-overlay"><div id="puzzle-panel"><button id="puzzle-close-btn" title="退出拼图">✕</button><h3 id="puzzle-title">拼图</h3><div id="puzzle-container"><div id="puzzle-board"><div class="hint-layer" id="hint-layer"></div></div><div id="puzzle-pieces"></div></div><div id="puzzle-status">请点击碎片，再点击对应格子放置</div><div id="puzzle-actions"><button class="puzzle-btn" id="puzzle-retry">再玩一次</button><button class="puzzle-btn skip" id="puzzle-skip">跳过拼图</button><button class="puzzle-btn continue" id="puzzle-continue">继续</button></div></div></div>
        <div id="end-screen"><div class="end-emoji">🐎</div><h2>千载犹闻马蹄声</h2><p>感谢你与六骏同行，<br />听它们讲述千年前的烽烟与同心。</p><button id="end-replay">再游一次</button></div>
    </div>
</div>

<script>
// ================================================================
//  图片资源
// ================================================================
const IMG = {
    xiaojun: 'tp/xiaojun.png',
    taizong: 'tp/lsm.png',
    taizongShadow: 'tp/lsmjianying.png',
    horse: {
        salu: 'ma/sa.png',
        quanmao: 'ma/quan.jpg',
        baiti: 'ma/bai.png',
        tele: 'ma/te.jpg',
        qingz: 'ma/qin.jpg',
        shifa: 'ma/shi.png',
    },
    puzzle: {
        salu: 'ptu/sa1.png',
        quanmao: 'ptu/quan1.png',
        baiti: 'ptu/bai1.png',
        tele: 'ptu/te1.png',
        qingz: 'ptu/qin1.png',
        shifa: 'ptu/shi1.png',
    },
    info: 'tp/yuedu.png',
};

const BG = {
    gugong: 'linear-gradient(135deg, #dccfc0 0%, #f5efe6 100%)',
    zhanlan: 'linear-gradient(135deg, #d4c5b0 0%, #ede5d8 100%)',
    caocong: 'linear-gradient(135deg, #a8b89a 0%, #c5d5b0 100%)',
    gucheng: 'linear-gradient(135deg, #8a7a6a 0%, #b8a892 100%)',
    huguan: 'linear-gradient(135deg, #9a8a7a 0%, #c8b8a8 100%)',
    caoyuan: 'linear-gradient(135deg, #8aaa7a 0%, #b8d8a0 100%)',
    xiandai: 'linear-gradient(135deg, #c8d8e8 0%, #e8f0f8 100%)',
};

const SCENES = {};
function D(id, d, n, o) { return { id, type:'dialogue', dialogues:d, next:n, ...o }; }
function B(id, title, options) { return { id, type:'branch', title, options }; }
function G(id, title, horse, next) { return { id, type:'game', title, horse, next }; }
function E(id) { return { id, type:'end' }; }

// ================================================================
//  第一幕 · 观展
// ================================================================
SCENES['s1'] = D('s1', [
    { char:'xiaojun', text:'这就是故宫啊，来北京这么久，还是第一次来好好参观。', bg:`url('tp/waijing1.png')` },
    { char:'xiaojun', text:'说起来，我这次来到故宫，还是为了参加"马上同心"实践团的社会实践项目。' },
    { char:'xiaojun', text:'我记得，我们要给甘肃的孩子们做一节微课，主题是马和中华民族共同体……我目前还没什么实践思路，不过，参观完神骏特展，我一定能学到很多吧。', bg:`url('tp/waijing2.png')` }
], 's2');

SCENES['s2'] = D('s2', [
    { char:'xiaojun', text:'这就是……《昭陵六骏图》，让我看看……', bg:`url('tp/zangui.png')` }
], 'branch_1');

// ---- 分支1：欣赏画作 & 阅读介绍（必须都完成） ----
SCENES['branch_1'] = {
    id:'branch_1', type:'branch_required', title:'做点什么呢？', stateKey:'branch1_done', next:'s3',
    options: [
        { text:'欣赏画作', next:'appreciate_dialog', key:'appreciate' },
        { text:'阅读介绍', next:'read_intro_dialog', key:'read_intro' }
    ]
};

// 欣赏画作结束后，不直接返回分支，而是检查是否全部完成
SCENES['appreciate_dialog'] = D('appreciate_dialog', [
    { char:'xiaojun', text:'飒露紫、拳毛騧、特勒骠、白蹄乌、青骓、什伐赤。每一匹马都有自己的特点。' },
    { char:'xiaojun', text:'飒露紫，身上还留着剑伤，这个为它拔剑的就是丘行恭吧。', horse:'salu', bg:`url('tp/1.png')` },
    { char:'xiaojun', text:'拳毛騧……你的身上也留下了不少剑伤，该是经历了多少战事？', horse:'quanmao', bg:`url('tp/2.png')` },
    { char:'xiaojun', text:'白蹄乌，好形象的名字。你看起来真有精神。', horse:'baiti', bg:`url('tp/3.png')` },
    { char:'xiaojun', text:'特勒骠，你的名字……有一种异域风情，或许你是一匹来自西域的良马！', horse:'tele', bg:`url('tp/4.png')` },
    { char:'xiaojun', text:'青骓，我喜欢你青白色的毛。', horse:'qingz', bg:`url('tp/5.png')` },
    { char:'xiaojun', text:'哦，还有什伐赤。红色的骏马，你又经历了怎样的战事呢？', horse:'shifa', bg:`url('tp/6.png')` },
    { char:'xiaojun', text:'明明只是一幅古画，我却仿佛能够从中感受到千年前，来自沙场的风。', bg:`url('tp/zangui.png')` }
], 'check_branch1');  // 转到检查

// 阅读介绍结束后，也转到检查
SCENES['read_intro_dialog'] = {
    id:'read_intro_dialog',
    type:'dialogue',
    dialogues: [ { char:'xiaojun', text:'原来如此，是这样啊。', bg:`url('tp/26.png')` } ],
    next:'check_branch1',
    bg:`url('tp/26.png')`
};

// 检查分支1是否全部完成 
SCENES['check_branch1'] = {
    id:'check_branch1',
    type:'check_branch',
    stateKey:'branch1_done',
    keys:['appreciate','read_intro'],
    next:'s3',
    branch:'branch_1'
};

SCENES['s3'] = D('s3', [
    { char:'xiaojun', text:'画里只记下了战马的英姿，可我想知道的远不止这些。', bg:`url('tp/zangui.png')` },
    { char:'xiaojun', text:'这些马背后，藏着怎样的人和故事？我要怎么把"中华民族共同体"的故事讲给孩子们听呢……' },
    { char:'xiaojun', text:'……咦？哪来的马蹄声？', bg:`url('tp/neijing.png')` }
], 's4');

SCENES['s4'] = D('s4', [
    { char:'taizong', text:'后世的女孩，你好啊。' },
    { char:'xiaojun', text:'（被吓了一跳）你是谁？' },
    { char:'xiaojun', text:'（os）天呐！这分明是唐代帝王的袍服！唐朝的都城本不在此处.他究竟是谁？' },
    { char:'taizong', text:'我见你久久凝视这六骏画卷，可是在好奇它们的过往？' },
    { char:'xiaojun', text:'是……是的，您是导游？怎么穿成这样？' },
    { char:'taizong', text:'导游？非也。世人皆知这昭陵六骏是随我平定天下的战马，可于我而言，它们的意义不止于此。' },
    { char:'taizong', text:'我想，它们是我的伙伴、我的亲人。征战多年，它们踏过的，也绝不只是战火烽烟，更是四海相融、万族同心的盛唐山河。' },
    { char:'xiaojun', text:'您的亲人？您难道是……' }
], 'branch_2');

SCENES['branch_2'] = B('branch_2', '他难道是……？', [
    { text:'唐太宗李世民！', next:'s5_taizong' },
    { text:'导游！', next:'s5_daoyou' }
]);

SCENES['s5_taizong'] = D('s5_taizong', [ { char:'taizong', text:'哈哈，正是。' } ], 's6', { revealTaizong:true });
SCENES['s5_daoyou'] = D('s5_daoyou', [
    { char:'taizong', text:'咳咳……非也非也，朕都说了朕不是导游。' },
    { char:'xiaojun', text:'那你是？' },
    { char:'taizong', text:'天可汗。' },
    { char:'xiaojun', text:'唐太宗李世民……可现在是现代啊？您……您怎么会出现在这里？' }
], 's6', { revealTaizong:true });

SCENES['s6'] = D('s6', [
    { char:'taizong', text:'朕亦不知，或许是这六匹与朕生死与共的老伙计在冥冥之中将朕唤来此处。' },
    { char:'xiaojun', text:'原来是这样。' },
    { char:'taizong', text:'姑娘，朕看你一心想要了解这六匹骏马。不如，你我二人共赴这画中世界，与它们会上一会，亲自听它们讲讲过去的故事。' },
    { char:'xiaojun', text:'求之不得！' },
    { char:'taizong', text:'那我们即刻启程！等等……朕还不知姑娘你的大名。' },
    { char:'xiaojun', text:'我叫小俊。' },
    { char:'taizong', text:'小俊，哈哈，好名字，当有骏马风度！' }
], 's7');

// ================================================================
//  第三幕 · 神骏
// ================================================================
SCENES['s7'] = D('s7', [
    { char:'xiaojun', text:'咦……这是一道机关？进入画中世界这么麻烦吗？', bg:`url('tp/17.png')` },
    { char:'taizong', text:'哈哈，或许是阔别多年，我的老朋友也害羞了。', bg:`url('tp/17.png')` }
], 'game_salu');

SCENES['game_salu'] = G('game_salu', '拼图 · 飒露紫', 'salu', 's8_salu');
SCENES['s8_salu'] = D('s8_salu', [
    { char:'taizong', text:'看来，这机关背后躲着的，就是飒露紫了。', bg:`url('tp/7.png')` }
], 's9_salu');

SCENES['s9_salu'] = D('s9_salu', [
    { char:'salu', text:'陛下。', bg:`url('tp/7.png')` },
    { char:'taizong', text:'好久不见。', bg:`url('tp/7.png')` },
    { char:'xiaojun', text:'飒露紫……这就是《昭陵六骏图》上，丘行恭将军为你拔箭时留下的伤口吗？', bg:`url('tp/7.png')` },
    { char:'salu', text:'小姑娘，你认得我？', bg:`url('tp/7.png')` },
    { char:'xiaojun', text:'你，你会说话！刚才，我在故宫见过你的画像。画像上，丘将军为你拔箭，你忍痛站着，一动也不动。', bg:`url('tp/7.png')` },

function getCharName(charId) {
    const map = { xiaojun:'小俊', taizong:'唐太宗', salu:'飒露紫', quanmao:'拳毛騧', baiti:'白蹄乌', tele:'特勒骠', qingz:'青骓', shifa:'什伐赤', qun:'六骏' };
    return map[charId] || charId;
}

function getRightImage(charId) {
    if (charId === 'taizong') return state.taizongRevealed ? IMG.taizong : IMG.taizongShadow;
    const horseMap = { salu: IMG.horse.salu, quanmao: IMG.horse.quanmao, baiti: IMG.horse.baiti, tele: IMG.horse.tele, qingz: IMG.horse.qingz, shifa: IMG.horse.shifa };
    return horseMap[charId] || '';
}

function updateAvatar(charId) {
    charLeft.style.display = 'none';
    charRight.style.display = 'none';
    charRight.classList.remove('char-person', 'char-horse', 'char-horse-special');
    if (charId === 'xiaojun') {
        charLeft.style.display = 'block';
        leftImg.src = IMG.xiaojun;
    } else {
        const src = getRightImage(charId);
        if (src) {
            charRight.style.display = 'block';
            rightImg.src = src;
            if (charId === 'taizong') charRight.classList.add('char-person');
            else {
                charRight.classList.add('char-horse');
                if (charId === 'qingz' || charId === 'shifa' || charId === 'tele') charRight.classList.add('char-horse-special');
            }
        }
    }
}

function renderScene(sceneId) {
    const scene = SCENES[sceneId];
    if (!scene) return;

    if (scene.type === 'branch' || scene.type === 'branch_required') { showBranch(scene); return; }
    if (scene.type === 'check_branch') {
        // 检查是否所有选项都完成
        const allDone = scene.keys.every(key => state[scene.stateKey] && state[scene.stateKey][key] === true);
        if (allDone) {
            goToScene(scene.next);
        } else {
            // 否则返回分支
            goToScene(scene.branch);
        }
        return;
    }
    if (scene.type === 'game') { initPuzzle(scene.horse, scene.next); return; }
    if (scene.type === 'end') { showEnd(); return; }



    if (scene.type === 'image') {
    // 隐藏对话框
    document.getElementById('dialog-box').style.display = 'none';
    // 设置背景为图片
    sceneBg.style.backgroundImage = `url('${scene.image}')`;
    sceneBg.style.backgroundSize = 'cover';
    sceneBg.style.backgroundPosition = 'center';
    // 设置点击事件
    sceneBg.onclick = function() {
        sceneBg.onclick = null;
        goToScene(scene.next);
    };
    return;
}




    if (scene.type === 'dialogue') {
        const dialogues = scene.dialogues;
        const idx = state.dialogIndex;
        if (idx >= dialogues.length) {
            if (scene.next) {
                state.dialogIndex = 0;
                if (scene.revealTaizong) state.taizongRevealed = true;
                goToScene(scene.next);
            }
            return;
        }
        const entry = dialogues[idx];
        const charId = entry.char;
        const text = entry.text;

        let bgStyle = scene.bg || entry.bg;
        if (bgStyle) {
            state.sceneBg = bgStyle;
            sceneBg.style.backgroundImage = bgStyle;
        } else if (!state.sceneBg) {
            state.sceneBg = BG.gugong;
            sceneBg.style.backgroundImage = BG.gugong;
        }

        updateAvatar(charId);
        dialogChar.textContent = getCharName(charId);
        dialogText.innerHTML = text.replace(/\n/g, '<br>');
        dialogContinue.classList.remove('hidden');
        dialogContinue.textContent = (idx === dialogues.length - 1) ? '继续' : '继续';
        state.currentScene = sceneId;
    }
}

function showBranch(scene) {
    // 如果所有选项已完成，直接跳转（用于安全防护）
    if (scene.type === 'branch_required' && scene.stateKey) {
        const allKeys = scene.options.map(o => o.key);
        const allDone = allKeys.every(key => state[scene.stateKey] && state[scene.stateKey][key] === true);
        if (allDone && scene.next) {
            goToScene(scene.next);
            return;
        }
    }

    branchOverlay.classList.add('show');
    branchTitle.textContent = scene.title || '请选择';
    const isRequired = scene.type === 'branch_required';
    const stateKey = scene.stateKey;

    branchOptions.innerHTML = '';
    scene.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'branch-option';
        btn.textContent = opt.text;

        let done = false;
        if (isRequired && opt.key && stateKey) {
            done = state[stateKey] ? state[stateKey][opt.key] || false : false;
            if (done) btn.classList.add('done');
        }

        btn.addEventListener('click', () => {
            if (isRequired && opt.key && stateKey && state[stateKey] && state[stateKey][opt.key]) return;
            branchOverlay.classList.remove('show');
            if (isRequired && opt.key && stateKey) {
                if (!state[stateKey]) state[stateKey] = {};
                state[stateKey][opt.key] = true;
                // 点击后直接跳转到选项的next
                state.dialogIndex = 0;
                goToScene(opt.next);
                return;
            }
            state.dialogIndex = 0;
            goToScene(opt.next);
        });
        branchOptions.appendChild(btn);
    });
}

function showEnd() {
    gameScreen.style.display = 'none';
    // 直接覆盖 background，包含图片、位置、大小
    endScreen.style.background = "url('tp/27.png') center/cover no-repeat";
    document.getElementById('end-replay').style.display = 'none';
    endScreen.classList.add('show');
}
// 确保 endScreen 的点击事件已绑定（您已有）
// 如果之前已绑定，无需重复；但为了防止丢失，我们重新绑定一次（覆盖之前的）
// 如果您希望保留之前绑定，可跳过，但建议统一。
// 我们可以在页面加载完成后重新绑定
document.addEventListener('DOMContentLoaded', function() {
    const endScreen = document.getElementById('end-screen');
    // 移除之前可能绑定的监听器（如果有多个，用 removeEventListener 可能麻烦，我们直接用新函数替换）
    // 为了避免重复绑定，我们移除所有监听器（但不容易），这里简单覆盖：
    // 我们采用新方式：直接替换 onclick
    endScreen.onclick = function() {
        endScreen.classList.remove('show');
        // 移除背景图片
        const img = endScreen.querySelector('.end-bg-img');
        if (img) img.remove();
        // 恢复按钮显示
        document.getElementById('end-replay').style.display = 'block';
        gameScreen.style.display = 'flex';
        coverScreen.classList.remove('hide');
        gameScreen.classList.remove('active');
        // 重置状态...
        state.currentScene = 's1';
        state.dialogIndex = 0;
        state.taizongRevealed = false;
        state.branch1_done = { appreciate: false, read_intro: false };
        state.branch_salu_done = { tianxia: false, name: false };
        state.branch_qing_shi_done = { battle: false, name: false };
        state.branch_bai_tele_done = { tele: false, baiti: false };
        state.sceneBg = '';
        state.isPuzzleComplete = false;
        coverScreen.classList.remove('hide');
        gameScreen.classList.remove('active');
    };
});
function goToScene(sceneId) {
    branchOverlay.classList.remove('show');
    puzzleOverlay.classList.remove('show');
    const scene = SCENES[sceneId];
    if (!scene) return;
    state.currentScene = sceneId;
    state.dialogIndex = 0;
    renderScene(sceneId);
}

dialogContinue.addEventListener('click', () => {
    const scene = SCENES[state.currentScene];
    if (!scene || scene.type !== 'dialogue') return;
    const dialogues = scene.dialogues;
    if (state.dialogIndex < dialogues.length - 1) {
        state.dialogIndex++;
        renderScene(state.currentScene);
    } else {
        if (scene.next) {
            state.dialogIndex = 0;
            if (scene.revealTaizong) state.taizongRevealed = true;
            goToScene(scene.next);
        }
    }
});

let selectedPiece = null;
let puzzlePiecesMap = [];

function loadPuzzleImage(horseId) {
    return new Promise((resolve) => {
        const src = IMG.puzzle[horseId];
        if (!src) { resolve(createFallbackCanvas(horseId)); return; }
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = src;
        img.onload = function() {
            const c = document.createElement('canvas');
            c.width = 300; c.height = 300;
            const ctx = c.getContext('2d');
            const size = Math.min(img.width, img.height);
            const sx = (img.width - size)/2, sy = (img.height - size)/2;
            ctx.drawImage(img, sx, sy, size, size, 0, 0, 300, 300);
            resolve(c);
        };
        img.onerror = function() { resolve(createFallbackCanvas(horseId)); };
    });
}

function createFallbackCanvas(horseId) {
    const c = document.createElement('canvas');
    c.width = 300; c.height = 300;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#dccfc0';
    ctx.fillRect(0,0,300,300);
    ctx.fillStyle = '#9b7b5b';
    ctx.font = 'bold 24px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('马',150,150);
    return c;
}

async function initPuzzle(horseId, nextScene) {
    state.puzzleData = { horseId, nextScene, placed:0, total:9 };
    state.isPuzzleComplete = false;
    state.puzzleAttempts = 0;

    const canvas = await loadPuzzleImage(horseId);
    const dataUrl = canvas.toDataURL('image/png');

    puzzleOverlay.classList.add('show');
    puzzleActions.classList.remove('show');
    puzzleStatus.textContent = '请点击碎片，再点击对应格子放置';
    puzzleStatus.style.color = 'var(--dark)';
    puzzleContinue.style.display = 'none';

    const names = { salu:'飒露紫', quanmao:'拳毛騧', baiti:'白蹄乌', tele:'特勒骠', qingz:'青骓', shifa:'什伐赤' };
    puzzleTitle.textContent = '拼图 · ' + (names[horseId] || '骏马');

    hintLayer.innerHTML = '';
    for (let i=0;i<9;i++) {
        const div = document.createElement('div');
        div.style.backgroundImage = `url(${dataUrl})`;
        const row = Math.floor(i/3), col = i%3;
        div.style.backgroundPosition = `-${col*100}px -${row*100}px`;
        div.style.backgroundSize = '300px 300px';
        hintLayer.appendChild(div);
    }

    puzzleBoard.querySelectorAll('.slot').forEach(el => el.remove());
    for (let i=0;i<9;i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.index = i;
        slot.dataset.filled = 'false';
        slot.dataset.pieceIdx = '-1';
        slot.addEventListener('click', () => onSlotClick(slot));
        puzzleBoard.appendChild(slot);
    }

    const indices = Array.from({length:9}, (_,i)=>i);
    for (let i=indices.length-1; i>0; i--) {
        const j = Math.floor(Math.random() * (i+1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }

    puzzlePieces.innerHTML = '';
    puzzlePiecesMap = [];
    for (const idx of indices) {
        const piece = document.createElement('div');
        piece.className = 'piece';
        piece.dataset.idx = idx;
        const row = Math.floor(idx/3), col = idx%3;
        piece.style.backgroundImage = `url(${dataUrl})`;
        piece.style.backgroundPosition = `-${col*100}px -${row*100}px`;
        piece.style.backgroundSize = '300px 300px';
        piece.addEventListener('click', () => onPieceClick(piece));
        puzzlePieces.appendChild(piece);
        puzzlePiecesMap.push({ element:piece, idx:idx, placed:false });
    }

    state.puzzleData.imgUrl = dataUrl;
    state.puzzleData.slots = document.querySelectorAll('#puzzle-board .slot');
    state.puzzleData.pieces = puzzlePiecesMap;
    state.puzzleData.placedCount = 0;
    selectedPiece = null;
}

function onPieceClick(piece) {
    if (state.isPuzzleComplete) return;
    if (piece.classList.contains('placed')) return;
    if (selectedPiece) selectedPiece.classList.remove('selected');
    selectedPiece = piece;
    piece.classList.add('selected');
    puzzleStatus.textContent = '已选择碎片，请点击拼图区格子放置';
    puzzleStatus.style.color = 'var(--dark)';
}

function onSlotClick(slot) {
    if (state.isPuzzleComplete) return;
    if (!selectedPiece) {
        puzzleStatus.textContent = '请先点击一个碎片！';
        puzzleStatus.style.color = '#b34a4a';
        return;
    }
    if (slot.dataset.filled === 'true') {
        puzzleStatus.textContent = '该格子已被占用，请选择其他格子';
        puzzleStatus.style.color = '#b34a4a';
        return;
    }
    const pieceIdx = parseInt(selectedPiece.dataset.idx);
    const slotIndex = parseInt(slot.dataset.index);
    const isCorrect = (pieceIdx === slotIndex);

    if (isCorrect) {
        const imgUrl = state.puzzleData.imgUrl;
        const row = Math.floor(pieceIdx/3), col = pieceIdx%3;
        slot.style.backgroundImage = `url(${imgUrl})`;
        slot.style.backgroundPosition = `-${col*100}px -${row*100}px`;
        slot.style.backgroundSize = '300px 300px';
        slot.dataset.filled = 'true';
        slot.dataset.pieceIdx = pieceIdx;
        slot.classList.add('correct');

        selectedPiece.classList.add('placed');
        selectedPiece.classList.remove('selected');
        const pMap = puzzlePiecesMap.find(p => p.element === selectedPiece);
        if (pMap) pMap.placed = true;

        state.puzzleData.placedCount++;
        puzzleStatus.textContent = '正确！已放置 ' + state.puzzleData.placedCount + '/9';
        puzzleStatus.style.color = '#5a7a4a';
        selectedPiece = null;

        if (state.puzzleData.placedCount === 9) {
            state.isPuzzleComplete = true;
            puzzleStatus.textContent = '拼图完成！';
            puzzleActions.classList.add('show');
            puzzleRetry.style.display = 'none';
            puzzleSkip.style.display = 'none';
            puzzleContinue.style.display = 'inline-block';
        }
    } else {
        state.puzzleAttempts++;
        slot.classList.add('wrong');
        puzzleStatus.textContent = '位置错误！请重试';
        puzzleStatus.style.color = '#b34a4a';
        puzzleActions.classList.add('show');
        puzzleRetry.style.display = 'inline-block';
        puzzleSkip.style.display = 'inline-block';
        puzzleContinue.style.display = 'none';
        setTimeout(() => slot.classList.remove('wrong'), 500);
        selectedPiece.classList.remove('selected');
        selectedPiece = null;
    }
}

puzzleRetry.addEventListener('click', () => {
    const horse = state.puzzleData.horseId;
    const next = state.puzzleData.nextScene;
    initPuzzle(horse, next);
});

puzzleSkip.addEventListener('click', () => {
    puzzleOverlay.classList.remove('show');
    const next = state.puzzleData.nextScene;
    if (next) { state.dialogIndex = 0; goToScene(next); }
});

puzzleContinue.addEventListener('click', () => {
    if (state.isPuzzleComplete) {
        puzzleOverlay.classList.remove('show');
        const next = state.puzzleData.nextScene;
        if (next) { state.dialogIndex = 0; goToScene(next); }
    }
});

puzzleCloseBtn.addEventListener('click', function() {
    puzzleOverlay.classList.remove('show');
    if (state.currentScene && SCENES[state.currentScene]) {
        renderScene(state.currentScene);
    }
});

// ================================================================
//  封面 & 启动
// ================================================================
coverScreen.addEventListener('click', () => {
    coverScreen.classList.add('hide');
    gameScreen.classList.add('active');
    state.currentScene = 's1';
    state.dialogIndex = 0;
    state.taizongRevealed = false;
    state.branch1_done = { appreciate:false, read_intro:false };
    state.sceneBg = BG.gugong;
    sceneBg.style.backgroundImage = BG.gugong;
    renderScene('s1');
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        if (!coverScreen.classList.contains('hide')) { coverScreen.click(); return; }
        if (branchOverlay.classList.contains('show')) return;
        if (puzzleOverlay.classList.contains('show')) return;
        if (endScreen.classList.contains('show')) return;
        if (!dialogContinue.classList.contains('hidden')) dialogContinue.click();
    }
});

sceneBg.style.backgroundImage = BG.gugong;
console.log('千载犹闻马蹄声 · 完整版已加载');
</script>
